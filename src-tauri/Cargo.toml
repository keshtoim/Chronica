[package]
name = "chronica"
version = "0.1.0"
description = "Chronica — календарь, задачи и трекер привычек с игровыми элементами"
authors = ["keshtoim"]
license = ""
repository = "https://github.com/keshtoim/Chronica"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
# Google Drive sync (desktop OAuth): локальный loopback-сервер для redirect_uri
# и открытие системного браузера для экрана согласия Google.
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"
